server {
    listen       8080;
    server_name  _;

    root   /opt/app-root/src;
    index  index.html;
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/index.html /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /opt/app-root/src;
    }
}
