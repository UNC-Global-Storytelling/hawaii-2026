server {
    listen       8080;
    server_name  _;

    root   /opt/app-root/src;
    index  index.html;
    absolute_redirect off;
    port_in_redirect off;

    # Serve known section roots directly (e.g. /eco) without slash redirects.
    location ~ ^/(eco|ocean|resilience|food|culture|about|story)$ {
        try_files $uri/index.html /index.html;
    }

    # Revalidate CSS/JS so deploys are not stuck behind a cached stylesheet.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri/index.html $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /opt/app-root/src;
    }
}
